version: "3.9"

services:
  web:
    build: .
    env_file: .env
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=mysql+pymysql://pbqms_user:pbqmspass@db/pbqms
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "5000:5000"
    volumes:
      - ./static/qrcodes:/app/static/qrcodes
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -c "flask db upgrade && flask seed-db && python wsgi.py"

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: pbqms
      MYSQL_USER: pbqms_user
      MYSQL_PASSWORD: pbqmspass
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  celery:
    build: .
    env_file: .env
    environment:
      - DATABASE_URL=mysql+pymysql://pbqms_user:pbqmspass@db/pbqms
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    command: celery -A app.tasks worker --loglevel=info
    depends_on:
      - db
      - redis

volumes:
  db_data:
